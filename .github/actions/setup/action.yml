name: Setup Bun + dependencies
description: Pin Bun, restore its install cache, and run `bun install`.

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        # 1.3.14: 1.3.10's `bun build --compile` had a module-scope symbol-dedup
        # bug that emitted an undefined `SnapshotPruner2` reference in the
        # darwin-arm64 daemon bundle (SDK 1.0.0), crashing the macos-arm64 daemon
        # smoke at startup. 1.3.14 produces a correct bundle on every target.
        bun-version: "1.3.14"
    - name: Restore Bun install cache
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-
    - name: Install dependencies
      shell: bash
      run: bun install
