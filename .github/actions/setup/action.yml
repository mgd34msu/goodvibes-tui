name: Setup Bun + dependencies
description: Pin Bun, restore its install cache, and install dependencies. THE
  single setup for this repo. Bun version has one source — the bun-version input
  (default below), which callers may override with a BUN_VERSION repo variable.
  Cache is always on.

inputs:
  bun-version:
    description: Bun version to pin. Single source of truth for this repo; pass a
      repo variable (e.g. ${{ vars.BUN_VERSION }}) to override the default.
    required: false
    # 1.3.14: 1.3.10's `bun build --compile` had a module-scope symbol-dedup bug
    # that emitted an undefined `SnapshotPruner2` reference in the darwin-arm64
    # daemon bundle (SDK 1.0.0), crashing the macos-arm64 daemon smoke at
    # startup. 1.3.14 produces a correct bundle on every target.
    default: "1.3.14"

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}
    - name: Restore Bun install cache
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
