name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on PRs only. A push to main (including a pin/release
  # commit) always runs to completion so its per-job-green verdict is never lost
  # to an auto-cancel that later reads as red.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Type check
        run: bun x tsc --noEmit --pretty false
      - name: Type check (tests)
        run: bun x tsc --noEmit -p tsconfig.test.json --pretty false
      - name: Type check coverage (annotation ratchet)
        run: bun run typecheck:coverage

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Configure git for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@test.com"
      - name: Run tests
        run: bun run test

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Configure git for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@test.com"
      - name: Coverage gate
        run: bun run test:coverage

  architecture-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Architecture check
        run: bun run architecture:check
      - name: Workflow structure check
        run: bun run workflows:check

  perf-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Performance budget check
        run: bun run perf:check

  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Run eval gate
        run: bun run eval:gate

  # ---------------------------------------------------------------------------
  # build+smoke: compile the linux-x64 binary through the toolchain
  # (goodvibes-build-binaries runs the configured prebuild, keeps sqlite-vec
  # --external, and stages the addon under dist/lib) and then EXECUTE it via
  # goodvibes-post-build-smoke, which asserts the version banner, rejects the
  # packaging-failure sentinels from toolchain.config smoke.forbiddenStrings,
  # and scans the artifact for top-level eager namespace reads. The old job ran
  # a bare `bun build --compile` and never started the binary at all.
  #
  # Runs on pull_request too: a PR that breaks the compile used to merge green
  # because this job was push-only.
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [typecheck, test, coverage, architecture-check, perf-check, eval-gate]
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build (linux-x64, through the pinned toolchain)
        run: bun run build:linux-x64
      - name: Compiled binary smoke (banner, sentinels, placeholder version)
        run: bun run smoke:tui --binary dist/goodvibes-linux-x64

  # ---------------------------------------------------------------------------
  # Package gate: the pre-tag half of the publish path. publish:check runs the
  # SDK-pin tri-agreement (overlay absent, exact-semver pin, installed == pin,
  # lockfile resolves the pin) plus the npm-specifier import sweep, which
  # otherwise ran for the first time INSIDE release.yml, after the GitHub
  # Release already existed. GOODVIBES_SKIP_NPM_AUTH_CHECK is the script's own
  # documented bypass for the one step CI has no credential for (the npm whoami
  # probe); every other gate in it runs for real here.
  # ---------------------------------------------------------------------------
  package-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Publish check (sdk-pin gate + lockfile agreement + tarball policy)
        env:
          GOODVIBES_SKIP_NPM_AUTH_CHECK: "1"
        run: bun run publish:check
      - name: Package install check (bin shims + fallback resolution)
        run: bun run package:install-check
      - name: Verification ledger
        run: bun run verification:ledger

  # ---------------------------------------------------------------------------
  # Zero-touch release. Runs only after EVERY gating job above is green (its
  # `needs` covers all of them, so GitHub schedules it last and only on full
  # success), and only for pushes to main. When the release commit's version has
  # no tag yet, it creates the annotated tag at this SHA and dispatches
  # release.yml at that tag with mode=release.
  #
  # The composite-action self-test is NOT one of those gates and no longer lives
  # in this workflow at all (.github/workflows/action-self-test.yml). It installs
  # the PREVIOUS published release and exercises the action wrapper against it,
  # which says nothing about whether this commit is releasable. Dropping it from
  # `needs` alone would not have de-gated it: release.yml's release-verify asserts
  # per-job green over EVERY job of this workflow's run, so any red job here,
  # relevant or not, blocks the release. Living in its own workflow file is what
  # makes it genuinely non-gating.
  #
  # Why the dispatch (not just the tag push): a tag pushed with GITHUB_TOKEN does
  # NOT trigger workflows, so the tag alone would never start release.yml. The
  # documented exception is that a workflow_dispatch API call made with
  # GITHUB_TOKEN DOES create a run, so we push the tag (for provenance + the
  # manual redo path) and then explicitly dispatch the release at that tag ref.
  # Idempotent: an already-existing tag is a logged no-op.
  # ---------------------------------------------------------------------------
  auto-release:
    name: Auto-release (tag + dispatch on green)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs:
      - typecheck
      - test
      - coverage
      - architecture-check
      - perf-check
      - eval-gate
      - build
      - package-gate
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Read version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Tag the release and dispatch release.yml (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          # Idempotent no-op if the tag already exists on the remote (a re-run,
          # or a manual tag already pushed): do not re-tag or re-dispatch.
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}"; then
            echo "Tag ${TAG} already exists on origin; nothing to do."
            exit 0
          fi
          git config user.name "GoodVibes CI"
          git config user.email "ci@goodvibes.local"
          git tag -a "${TAG}" -m "release ${VERSION}" "${SHA}"
          # Push with GITHUB_TOKEN: this does NOT trigger release.yml (token
          # pushes never trigger workflows), which is why we dispatch below.
          git push origin "refs/tags/${TAG}"
          echo "Created and pushed ${TAG} at ${SHA}."
          # Dispatch release.yml at the tag ref. workflow_dispatch via the API
          # under GITHUB_TOKEN DOES create a run (the documented exception).
          for attempt in 1 2 3 4 5 6 7 8; do
            if gh workflow run release.yml --ref "refs/tags/${TAG}" -f mode=release; then
              echo "Dispatched release.yml for ${TAG} (mode=release)."
              exit 0
            fi
            echo "gh workflow run failed (attempt ${attempt}/8); retrying in 7s…" >&2
            sleep 7
          done
          echo "ERROR: failed to dispatch release.yml for ${TAG} after 8 attempts." >&2
          exit 1
