name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - name: Install dependencies
        run: bun install
      - name: Type check
        run: bun x tsc --noEmit --pretty false

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - name: Install dependencies
        run: bun install
      - name: Configure git for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@test.com"
      - name: Run tests
        run: bun run test

  perf-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - name: Install dependencies
        run: bun install
      - name: Performance budget check
        run: bun run perf:check

  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - name: Install dependencies
        run: bun install
      - name: Restore eval baseline
        id: eval-baseline-restore
        uses: actions/cache/restore@v4
        with:
          path: .goodvibes/eval/baseline.json
          key: eval-baseline-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            eval-baseline-${{ github.ref_name }}-
            eval-baseline-main-
      - name: Run eval gate
        run: bun run eval:gate
      - name: Save eval baseline (main branch only)
        if: github.ref == 'refs/heads/main' && success() && steps.eval-baseline-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .goodvibes/eval/baseline.json
          key: eval-baseline-${{ github.ref_name }}-${{ github.sha }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push'
    needs: [typecheck, test, perf-check, eval-gate]
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - name: Install dependencies
        run: bun install
      - name: Build
        run: bun run build
