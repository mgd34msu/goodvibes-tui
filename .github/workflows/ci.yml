name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44e0eca8eda0700b6c94a # v2.0.2
        with:
          bun-version: "1.2.x"
          cache: true
      - name: Install dependencies
        run: bun install
      - name: Type check
        run: bunx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44e0eca8eda0700b6c94a # v2.0.2
        with:
          bun-version: "1.2.x"
          cache: true
      - name: Install dependencies
        run: bun install
      - name: Run tests
        run: bun test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push'
    needs: [typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44e0eca8eda0700b6c94a # v2.0.2
        with:
          bun-version: "1.2.x"
          cache: true
      - name: Install dependencies
        run: bun install
      - name: Build
        run: bun run build
