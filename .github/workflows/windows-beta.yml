name: Windows beta (non-gating)

# Native Windows is BETA and deliberately NOT part of the release gate.
# This workflow validates the ref (typecheck + tests), builds the windows-x64
# binary through the SAME toolchain path every shipped target uses
# (goodvibes-build-binaries, driven by toolchain.config.json), and runs the SAME
# post-build smoke the release matrix runs (banner prefix, packaging-failure
# sentinels, no placeholder version, no build-order-lottery namespace reads) on a
# REAL Windows runner. Every job passes or fails; never continue-on-error.
#
# A green run here is therefore the same evidence the release matrix produces for
# linux/darwin, which is what makes it a usable promotion signal for moving
# windows-x64 into the release matrix. It runs weekly as well as on demand, so
# the signal cannot quietly go stale between manual dispatches.
# See docs/windows.md for the staging plan and the POSIX blockers.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build"
        required: false
        default: "main"
  schedule:
    # Weekly. A scheduled run has no inputs.ref, so it builds the default branch.
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  # ── Validate the ref itself first: a "Windows build is green" claim means
  #    nothing if the source it built does not typecheck or pass its tests. ───
  verify-ref:
    name: Typecheck + tests (the built ref)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - name: Setup
        uses: ./.github/actions/setup
      - name: Configure git for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@test.com"
      - name: Type check
        run: bun x tsc --noEmit --pretty false
      - name: Type check (tests)
        run: bun x tsc --noEmit -p tsconfig.test.json --pretty false
      - name: Run tests
        run: bun run test

  build-windows-beta:
    name: Build windows-x64 (beta)
    needs: [verify-ref]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - name: Setup
        uses: ./.github/actions/setup
      # goodvibes-build-binaries runs the configured prebuild, compiles for
      # bun-windows-x64 (cross-compiled from Linux; a supported target that
      # produces a PE32+ executable), keeps sqlite-vec --external, and fetches
      # the windows sqlite-vec addon (vec0.dll) into dist/lib. The old step ran a
      # bare `bun build --compile`, which skipped the prebuild and staged no
      # addon at all.
      - name: Build windows-x64 TUI binary (beta, through the pinned toolchain)
        run: bun run build:windows
      - name: Report binary size
        run: ls -lh dist/goodvibes-windows-x64.exe
      - name: Upload windows-x64 beta artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64-beta-binaries
          # One glob per line: upload-artifact splits `path` on newlines only.
          # dist/lib carries the sqlite-vec addon beside the binary, the layout
          # the runtime resolver expects, so the smoke job below runs the exe in
          # the same shape a user would get.
          path: |
            dist/goodvibes-windows-x64.exe
            dist/lib
          if-no-files-found: error
          retention-days: 1

  smoke-windows-beta:
    name: Windows smoke (windows-x64 beta)
    # REAL required smoke: this job passes or fails. It is intentionally NOT
    # continue-on-error. Because this whole workflow is separate from Release,
    # a failure here never blocks a release; it only reports Windows status.
    needs: [build-windows-beta]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      # The checkout is what puts toolchain.config.json on disk; the smoke CLI
      # reads its `smoke` section (banner prefix + forbidden strings) from the
      # working directory.
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      # setup-bun only, not the composite setup: the smoke needs the toolchain
      # CLI and the config, not this repo's dependency tree, and a full
      # `bun install` on a Windows runner buys nothing here.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Download windows-x64 beta artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-x64-beta-binaries
          path: dist
      - name: Post-build smoke (goodvibes-windows-x64.exe)
        # Same gate the release matrix runs on its executable legs, at the same
        # pinned toolchain version as package.json and release.yml. It asserts
        # the version banner prefix, rejects the packaging-failure sentinels
        # (a placeholder version or a leaked "$bunfs/root"/"sqlite-vec" string),
        # and scans the artifact for top-level eager namespace reads. The old
        # step hand-rolled an exit-code plus banner-prefix check in pwsh and
        # caught none of the rest.
        run: bunx @pellux/goodvibes-toolchain@2.0.23 goodvibes-post-build-smoke --binary dist/goodvibes-windows-x64.exe
